apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payment-gateway-api
  description: API REST para la gestión de cargos y reembolsos.
spec:
  type: openapi
  lifecycle: production
  owner: payments-team
  definition: |
    openapi: 3.0.0
    info:
      title: Payment Gateway API
      version: 1.0.0
      description: Documentación interactiva de la API de pagos.
    paths:
      /v1/charges:
        post:
          summary: Crear un nuevo cargo
          responses:
            '200':
              description: Pago procesado correctamente
      /v1/status/{id}:
        get:
          summary: Consultar estado de una transacción
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Información de la transacción